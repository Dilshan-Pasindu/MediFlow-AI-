name: Render Services Keep-Alive

on:
  schedule:
    # Runs every 14 minutes to ping Render free-tier services to prevent cold starts
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-services:
    name: Ping Free-Tier Services
    runs-on: ubuntu-latest

    steps:
      - name: Send Health Probes
        env:
          AI_SERVICE_URL: ${{ secrets.AI_SERVICE_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$AI_SERVICE_URL" ] && [ -z "$BACKEND_URL" ]; then
            echo "::error::Neither 'AI_SERVICE_URL' nor 'BACKEND_URL' secret is configured under Repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -n "$AI_SERVICE_URL" ]; then
            AI_BASE="${AI_SERVICE_URL%/}"
            echo "Pinging AI microservice health endpoint at ${AI_BASE}/health..."
            AI_RESP=$(curl --fail --silent --show-error --max-time 30 "${AI_BASE}/health" || echo "FAILED")
            echo "AI Health response: ${AI_RESP}"
          fi

          if [ -n "$BACKEND_URL" ]; then
            BACKEND_BASE="${BACKEND_URL%/}"
            echo "Pinging Backend health endpoint at ${BACKEND_BASE}/health..."
            BACKEND_RESP=$(curl --fail --silent --show-error --max-time 30 "${BACKEND_BASE}/health" || echo "FAILED")
            echo "Backend Health response: ${BACKEND_RESP}"
          fi
