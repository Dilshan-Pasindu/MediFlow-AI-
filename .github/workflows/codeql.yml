name: MediFlow AI Security & CodeQL Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 4 * * 1' # Runs every Monday at 04:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # CodeQL Static Application Security Testing (SAST)
  # ─────────────────────────────────────────────────────────────────────────────
  analyze:
    name: CodeQL Security Scan (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Setup .NET SDK (for C# scan)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build C# Solution
        if: matrix.language == 'csharp'
        run: |
          dotnet restore backend/MediFlow.Api/MediFlow.Api.csproj
          dotnet build backend/MediFlow.Api/MediFlow.Api.csproj -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Dependency Vulnerability Audit
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check Vulnerable NuGet Packages
        run: |
          dotnet list backend/MediFlow.Api/MediFlow.Api.csproj package --vulnerable || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Vulnerable NPM Packages
        working-directory: web/mediflow-web
        run: |
          npm audit --audit-level=high || echo "NPM audit completed with warnings."
