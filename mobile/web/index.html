<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mediflow_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mediflow_mobile</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id" content="829691660050-tljhqp9iau6cgbk3nnln71p8971hpaa2.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0B2E4A;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    flutter-view, flt-glass-pane {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }
    .loading-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0B2E4A 0%, #1565C0 50%, #1A1B4B 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }
    .loading-logo-card {
      background: #ffffff;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35), 0 0 30px rgba(79, 209, 197, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loading-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      animation: heartbeat-pump 2.2s ease-in-out infinite;
    }
    .loading-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    @keyframes heartbeat-pump {
      0% { transform: scale(1); }
      14% { transform: scale(1.04); }
      28% { transform: scale(1); }
      42% { transform: scale(1.025); }
      56% { transform: scale(1); }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading-logo { animation: none; }
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="loading-logo-card">
      <img src="favicon.png" alt="MediFlow AI" class="loading-logo" />
    </div>
    <div class="loading-text">MediFlow AI</div>
  </div>
  <script>
    function removeLoader() {
      const loader = document.querySelector('.loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoader);
    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (node.nodeType === 1 && (node.tagName === 'FLUTTER-VIEW' || node.tagName === 'FLT-GLASS-PANE')) {
            removeLoader();
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
