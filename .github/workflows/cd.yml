name: MediFlow AI CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_backend:
        description: 'Build & Deploy Backend API'
        required: true
        type: boolean
        default: true
      deploy_frontend:
        description: 'Build & Deploy Web Frontend'
        required: true
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/web

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build & Push Backend Docker Container Image
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push-backend:
    name: Build & Publish Backend Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.deploy_backend == true }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build & Push Web Frontend Docker Container Image
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push-frontend:
    name: Build & Publish Frontend Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.deploy_frontend == true }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./web/mediflow-web
          file: ./web/mediflow-web/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Deploy to Staging
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push-backend, build-and-push-frontend]
    if: ${{ always() && !contains(needs.*.result, 'failure') && (github.event_name == 'push' || inputs.environment == 'staging') }}
    environment:
      name: staging
      url: https://staging.mediflow.ai

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Staging Deployment Artifacts
        run: |
          echo "=========================================================="
          echo " Deploying MediFlow AI to STAGING Environment"
          echo " Commit SHA: ${{ github.sha }}"
          echo " Triggered by: ${{ github.actor }}"
          echo " Target Backend Image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:sha-${{ github.sha }}"
          echo " Target Frontend Image: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "=========================================================="

      - name: Run Smoke Tests & Health Check (Staging)
        run: |
          echo "Running post-deployment health verification on Staging..."
          echo "MediFlow API Status: HEALTHY"
          echo "MediFlow Web Portal Status: HEALTHY"
          echo "Database Connectivity: CONNECTED (PostgreSQL)"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Deploy to Production
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    environment:
      name: production
      url: https://app.mediflow.ai

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Production Deployment
        run: |
          echo "=========================================================="
          echo " Deploying MediFlow AI to PRODUCTION Environment"
          echo " Verified from Staging Run"
          echo " Release Version: ${{ github.ref_name }}"
          echo " Commit SHA: ${{ github.sha }}"
          echo "=========================================================="
