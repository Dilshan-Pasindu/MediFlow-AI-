name: Security & Governance Guard

on:
  pull_request:
    branches:
      - main
      - master
      - dev
  push:
    branches:
      - main
      - master
      - dev

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  verify-governance:
    name: Verify Governance & Merge Authority
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CODEOWNERS Integrity
        run: |
          echo "Checking integrity of .github/CODEOWNERS..."

          if [ ! -f ".github/CODEOWNERS" ]; then
            echo "::error::Critical governance file .github/CODEOWNERS is missing!"
            exit 1
          fi

          if ! grep -q "\* @Dilshan-Pasindu" .github/CODEOWNERS; then
            echo "::error::Primary ownership '* @Dilshan-Pasindu' has been altered or removed!"
            exit 1
          fi

          if ! grep -q "/\.github/CODEOWNERS @Dilshan-Pasindu" .github/CODEOWNERS; then
            echo "::error::Specific ownership '/.github/CODEOWNERS @Dilshan-Pasindu' has been altered or removed!"
            exit 1
          fi

          echo "CODEOWNERS integrity verified successfully."

      - name: Guard PR Merge Authority on Main
        if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master')
        run: |
          echo "Evaluating Pull Request #${{ github.event.pull_request.number }} targeting protected branch '${{ github.base_ref }}'..."
          echo "PR Actor: ${{ github.actor }}"
          echo "NOTE: Merging into main is exclusively authorized for repository owner @Dilshan-Pasindu."

      - name: Restrict CODEOWNERS Modifications
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}..HEAD || true)

          if echo "$CHANGED_FILES" | grep -E '^.github/CODEOWNERS$'; then
            echo "Detected modifications to .github/CODEOWNERS in Pull Request #${{ github.event.pull_request.number }}."

            if [ "${{ github.actor }}" != "Dilshan-Pasindu" ]; then
              echo "::error::SECURITY VIOLATION: Only repository owner @Dilshan-Pasindu is permitted to modify .github/CODEOWNERS!"
              exit 1
            else
              echo "Modification authored by repository owner @Dilshan-Pasindu. Permitted."
            fi
          fi

      - name: Enforce Minimum Commits for Contributors
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const author = (pr.user && pr.user.login) ? pr.user.login : context.actor;
            const prNumber = pr.number;
            const commitCount = pr.commits;
            const MAX_ALLOWED_COMMITS = 30;

            console.log(`Evaluating PR #${prNumber} authored by @${author}`);
            console.log(`Total commits in PR: ${commitCount}`);

            // Repository owner @Dilshan-Pasindu is exempt from commit count limits
            if (author.toLowerCase() === 'dilshan-pasindu' || context.actor.toLowerCase() === 'dilshan-pasindu') {
              console.log(`PR authored/acted by repository owner @Dilshan-Pasindu. Exempt from commit count restrictions. Unlimited commits permitted.`);
              return;
            }

            // Check commit count for all other contributors
            if (commitCount > MAX_ALLOWED_COMMITS) {
              const errorMsg = `COMMIT POLICY VIOLATION: Pull Request contains ${commitCount} commits, exceeding the allowed maximum of ${MAX_ALLOWED_COMMITS} commits for contributors.`;
              core.setFailed(errorMsg);

              const commentBody = `⚠️ **Commit Policy Violation — Excessive Commits Detected**\n\n` +
                `Hi @${author}, MediFlow AI requires all contributors to submit pull requests with **reasonable commits** (maximum **${MAX_ALLOWED_COMMITS} commits** per PR, recommended 20–30 commits).\n\n` +
                `Your pull request currently contains **${commitCount} commits**.\n\n` +
                `### 🛠️ How to Squash Your Commits:\n` +
                `Run the following commands on your local feature branch to squash your changes into a single clean commit:\n\n` +
                `\`\`\`bash\n` +
                `# 1. Fetch the latest target branch\n` +
                `git fetch origin dev\n\n` +
                `# 2. Reset your commits to dev while preserving your code changes in working directory\n` +
                `git reset --soft origin/dev\n\n` +
                `# 3. Create a clean, consolidated commit\n` +
                `git add .\n` +
                `git commit -m "feat(scope): your consolidated feature description"\n\n` +
                `# 4. Force push the squashed commit\n` +
                `git push --force-with-lease\n` +
                `\`\`\`\n\n` +
                `Once squashed, this check will automatically pass. Thank you for keeping our git history clean!\n\n` +
                `*(Note: Repository owner @Dilshan-Pasindu is exempt from this policy)*`;

              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody
                });
                console.log(`Posted commit policy guidance comment on PR #${prNumber}`);
              } catch (err) {
                console.warn(`Could not post PR comment (token permissions on fork): ${err.message}`);
              }
            } else {
              console.log(`Commit count check passed: ${commitCount} / ${MAX_ALLOWED_COMMITS} commits.`);
            }
